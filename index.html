<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>konnect</title>
    <script>
      // Apply the stored theme before first paint so there is no flash of the
      // default palette. Mirrors applyTheme() in src/lib/theme.ts.
      try {
        var root = document.documentElement
        var themes = ['black', 'green', 'violet']
        var theme = localStorage.getItem('konnect-theme')
        if (themes.indexOf(theme) === -1) theme = 'black'
        var mode = localStorage.getItem('konnect-mode') || 'system'
        var dark =
          mode === 'dark' ||
          (mode === 'system' &&
            matchMedia('(prefers-color-scheme: dark)').matches)
        root.dataset.theme = theme
        root.classList.toggle('dark', dark)
        root.style.colorScheme = dark ? 'dark' : 'light'
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
